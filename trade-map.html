<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0F172A; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }
  .lbl { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 9px; letter-spacing: .22em; text-transform: uppercase; fill: rgba(248,246,242,.6); }
  .hub { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: .26em; text-transform: uppercase; fill: #C9A45C; }
  @keyframes drawArc { from { stroke-dashoffset: var(--len) } to { stroke-dashoffset: 0 } }
  path.arc { animation: drawArc 1900ms cubic-bezier(.4,0,.2,1) both; }
</style>
</head>
<body>
<svg id="map"></svg>
<script>
const HUB = [55.30, 25.27];
const NODES = [
  { n: 'California', c: [-120.0, 37.0], side: 'left' },
  { n: 'Chile', c: [-71.0, -33.5], side: 'left' },
  { n: 'Turkiye', c: [35.0, 39.0], side: 'right' },
  { n: 'Iran', c: [53.0, 32.5], side: 'right' },
  { n: 'India', c: [78.0, 22.0], side: 'right' },
  { n: 'Vietnam', c: [106.0, 16.0], side: 'right' },
  { n: 'Kenya', c: [37.9, -0.5], side: 'right' },
  { n: 'Europe', c: [9.0, 49.0], side: 'left' },
  { n: 'Saudi Arabia', c: [45.0, 24.0], side: 'left' }
];

async function draw() {
  const svg = d3.select('#map');
  const w = window.innerWidth, h = window.innerHeight;
  svg.attr('viewBox', '0 0 ' + w + ' ' + h);
  svg.selectAll('*').remove();

  const topo = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json');
  const land = topojson.feature(topo, topo.objects.countries);
  const projection = d3.geoNaturalEarth1().fitExtent([[24, 30], [w - 24, h - 30]], land);
  const path = d3.geoPath(projection);

  svg.append('g').selectAll('path').data(land.features).join('path')
    .attr('d', path)
    .attr('fill', '#16233B')
    .attr('stroke', 'rgba(201,164,92,.22)')
    .attr('stroke-width', .6);

  const hubXY = projection(HUB);
  const arcs = svg.append('g');
  NODES.forEach((d, i) => {
    const p = projection(d.c);
    const mx = (hubXY[0] + p[0]) / 2, my = (hubXY[1] + p[1]) / 2 - Math.abs(hubXY[0] - p[0]) * 0.22;
    const el = arcs.append('path')
      .attr('d', 'M' + p[0] + ',' + p[1] + ' Q' + mx + ',' + my + ' ' + hubXY[0] + ',' + hubXY[1])
      .attr('fill', 'none').attr('stroke', 'rgba(201,164,92,.55)').attr('stroke-width', 1);
    const len = el.node().getTotalLength();
    el.attr('class', 'arc').attr('stroke-dasharray', len).attr('stroke-dashoffset', 0)
      .style('--len', len + 'px').style('animation-delay', (300 + i * 180) + 'ms');

    svg.append('circle').attr('cx', p[0]).attr('cy', p[1]).attr('r', 3)
      .attr('fill', '#0F172A').attr('stroke', '#C9A45C').attr('stroke-width', 1.2)
      .attr('opacity', 1);
    svg.append('text').attr('class', 'lbl')
      .attr('x', d.side === 'left' ? p[0] - 9 : p[0] + 9).attr('y', p[1] + 3.5)
      .attr('text-anchor', d.side === 'left' ? 'end' : 'start')
      .text(d.n)
      .attr('opacity', 1);
  });

  svg.append('circle').attr('cx', hubXY[0]).attr('cy', hubXY[1]).attr('r', 14)
    .attr('fill', 'rgba(201,164,92,.14)').attr('stroke', 'rgba(201,164,92,.35)');
  svg.append('circle').attr('cx', hubXY[0]).attr('cy', hubXY[1]).attr('r', 5)
    .attr('fill', '#C9A45C');
  svg.append('text').attr('class', 'hub')
    .attr('x', hubXY[0]).attr('y', hubXY[1] + 32).attr('text-anchor', 'middle')
    .text('Dubai');
}

draw();
let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 250); });
</script>
</body>
</html>
