<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0B1220; }
  #map { position: absolute; inset: 0; background: #0B1220; }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(185deg) saturate(.28) brightness(.82) contrast(1.08); }
  .leaflet-container { background: #0B1220; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .leaflet-control-attribution {
    background: rgba(11,18,32,.78) !important; color: rgba(248,246,242,.55) !important;
    font-size: 9px !important; letter-spacing: .04em; border-top-left-radius: 6px;
  }
  .leaflet-control-attribution a { color: rgba(201,164,92,.85) !important; }
  .leaflet-control-zoom a {
    background: rgba(11,18,32,.88) !important; color: #C9A45C !important;
    border-color: rgba(201,164,92,.35) !important;
  }
  .leaflet-control-zoom a:hover { background: rgba(201,164,92,.16) !important; }
  .kaka-pin { position: relative; width: 18px; height: 18px; }
  .kaka-pin i {
    position: absolute; inset: 0; border: 2px solid #C9A45C; border-radius: 50%;
    background: #0B1220; box-shadow: 0 0 0 6px rgba(201,164,92,.14);
  }
  .kaka-pin b {
    position: absolute; inset: -6px; border: 1px solid rgba(201,164,92,.7); border-radius: 50%;
    animation: kakaPulse 3200ms ease-out infinite;
  }
  @keyframes kakaPulse { 0% { transform: scale(.7); opacity: .7 } 70%, 100% { transform: scale(2.4); opacity: 0 } }
  .leaflet-tooltip.kaka-label {
    background: rgba(11,18,32,.88); border: 1px solid rgba(201,164,92,.4); border-radius: 8px;
    padding: 9px 14px; color: #F8F6F2; font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    white-space: nowrap; box-shadow: 0 10px 26px rgba(11,18,32,.45);
  }
  .leaflet-tooltip.kaka-label::before { display: none; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  var HQ = [25.2670, 55.3090];
  var map = L.map('map', { center: HQ, zoom: 16, scrollWheelZoom: false, zoomControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);
  L.marker(HQ, {
    icon: L.divIcon({ className: '', html: '<div class="kaka-pin"><b></b><i></i></div>', iconSize: [18, 18], iconAnchor: [9, 9] })
  }).addTo(map).bindTooltip('Rolex Twin Tower &middot; Office No. 1001', {
    permanent: true, direction: 'top', offset: [0, -14], className: 'kaka-label', opacity: 1
  });
</script>
</body>
</html>
